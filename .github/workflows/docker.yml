name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push-cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ml-docker-template:cpu
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ml-docker-template:cpu-buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ml-docker-template:cpu-buildcache,mode=max

  build-and-push-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push GPU Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gpu
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ml-docker-template:gpu
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ml-docker-template:gpu-buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ml-docker-template:gpu-buildcache,mode=max